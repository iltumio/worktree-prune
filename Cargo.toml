[package]
name = "worktree-prune"
version = "0.1.0"
edition = "2024"
description = "Safely remove Git worktrees and their external Cargo targets, with an interactive TUI"
license = "MIT"
repository = "https://github.com/iltumio/worktree-prune"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
toml = "1"
walkdir = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
