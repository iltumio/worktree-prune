name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Integration tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: TUI tests in a pseudoterminal
        run: python3 tests/tui.py target/release/worktree-prune
      - name: Package binary
        run: tar -czf worktree-prune-linux-x86_64.tar.gz -C target/release worktree-prune -C ../.. LICENSE README.md
      - uses: actions/upload-artifact@v7
        with:
          name: worktree-prune-linux-x86_64
          path: worktree-prune-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
